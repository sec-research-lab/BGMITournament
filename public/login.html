<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BGMI Tournament</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-slideshow">
    <div class="bg-slide" style="background-image:url('img/bg/bg1.jpg')"></div>
    <div class="bg-slide" style="background-image:url('img/bg/bg2.jpg')"></div>
    <div class="bg-slide" style="background-image:url('img/bg/bg3.jpg')"></div>
    <div class="bg-slide" style="background-image:url('img/bg/bg4.jpg')"></div>
    <div class="bg-scrim"></div>
  </div>
  <div class="login-layout">
    <!-- ===== YouTube live video box ===== -->
    <div class="yt-box" id="ytBox" style="display:none">
      <div class="yt-thumb" id="ytThumb" onclick="playYt()">
        <img id="ytThumbImg" src="" alt="Live stream thumbnail">
        <div class="yt-play-btn">▶</div>
        <div class="yt-thumb-label">Tap to watch live</div>
      </div>
    </div>

    <div class="auth-card">
      <div class="brand">🎮 BGMI <span>TOURNAMENT</span></div>
      <div class="subtitle">Login with your BGMI ID</div>

      <div id="msg" class="form-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>BGMI ID</label>
          <input type="text" id="bgmiId" placeholder="Your BGMI Character ID" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">LOGIN</button>
      </form>

      <div class="auth-footer">
        New player? <a href="register.html">Register here</a><br><br>
        <a href="admin.html" style="color:var(--muted);font-size:0.8rem">Admin Portal →</a>
      </div>
    </div>
  </div>

  <script>
    function getYoutubeId(url) {
      if (!url) return '';
      try {
        const u = new URL(url);
        let id = '';
        if (u.hostname.includes('youtu.be')) {
          id = u.pathname.slice(1);
        } else if (u.searchParams.get('v')) {
          id = u.searchParams.get('v');
        } else if (u.pathname.includes('/live/')) {
          id = u.pathname.split('/live/')[1];
        } else if (u.pathname.includes('/embed/')) {
          id = u.pathname.split('/embed/')[1];
        }
        return (id || '').split('?')[0].split('&')[0];
      } catch {
        return '';
      }
    }

    let ytVideoId = '';

    function playYt() {
      if (!ytVideoId) return;
      const box = document.getElementById('ytBox');
      box.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytVideoId}?autoplay=1" title="YouTube live stream" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }

    (async function loadYtSetting() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        ytVideoId = getYoutubeId(data.youtubeUrl);
        if (ytVideoId) {
          document.getElementById('ytThumbImg').src = `https://img.youtube.com/vi/${ytVideoId}/hqdefault.jpg`;
          document.getElementById('ytBox').style.display = 'flex';
        }
      } catch {}
    })();
  </script>

  <script>
    const msg = document.getElementById('msg');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'form-msg';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bgmiId: document.getElementById('bgmiId').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        location.href = 'dashboard.html';
      } catch (err) {
        msg.className = 'form-msg error';
        msg.textContent = err.message;
      }
    });
  </script>
  <div class="version-tag">bgmi v1.0.1</div>
</body>
</html>
