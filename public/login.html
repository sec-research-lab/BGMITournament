<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BGMI Tournament</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">🎮 BGMI <span>TOURNAMENT</span></div>
      <div class="subtitle">Login with your BGMI ID</div>

      <div id="msg" class="form-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>BGMI ID</label>
          <input type="text" id="bgmiId" placeholder="Your BGMI Character ID" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">LOGIN</button>
      </form>

      <div class="auth-footer">
        New player? <a href="register.html">Register here</a><br><br>
        <a href="admin.html" style="color:var(--muted);font-size:0.8rem">Admin Portal →</a>
      </div>
    </div>
  </div>

  <script>
    const msg = document.getElementById('msg');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'form-msg';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bgmiId: document.getElementById('bgmiId').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        location.href = 'dashboard.html';
      } catch (err) {
        msg.className = 'form-msg error';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
